dius:10px;padding:14px;max-height:285px;overflow:auto}.checks{margin:14px 0}.checks h4{margin:15px 0 7px;color:#294e66;font-size:12px}.check{font-size:12px;color:#43576b;padding:8px 0;border-bottom:1px solid #f0f3f6;display:flex;align-items:flex-start;gap:9px}.boxcheck{height:16px;width:16px;border:1px solid #abb8c6;border-radius:4px;flex:none;margin-top:1px;text-align:center}.boxcheck.checked{color:#297e60;background:#ddf4e9;border-color:#7ebca4}.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px;font-size:12px;font-weight:750;color:#526579}.field input,.field textarea,.field select{border:1px solid #cdd8e1;border-radius:9px;padding:12px;width:100%;font-weight:400}.field textarea{min-height:105px;resize:vertical}.helptext{font-size:12px;color:#7a8797;line-height:1.6}.warning{background:#fff6e9;border:1px solid #eed4a9;padding:12px;border-radius:10px;font-size:12px;color:#8a5a24}.footnote{font-size:11px;color:#8896a5;margin:25px 0}.hidden{display:none!important}@media(max-width:1050px){.metrics{grid-template-columns:repeat(2,1fr)}.twocol{grid-template-columns:1fr}.cars{grid-template-columns:repeat(3,1fr)}.kanban{grid-template-columns:repeat(4,minmax(235px,1fr))}}@media(max-width:760px){.app{display:block}.side{position:static;height:auto;width:100%;padding:8px 12px 12px}.brand{padding:9px 4px 12px}.brand small{font-size:9px}.navblock{display:flex;gap:5px;overflow-x:auto}.menutitle{display:none}.navitem{white-space:nowrap;width:auto;flex:0 0 auto}.sidebar-foot{display:none}.top{height:55px;padding:0 16px}.content{padding:22px 14px}.cars{grid-template-columns:1fr}.hrow h1{font-size:25px}.metrics{gap:9px}.metric{padding:15px}}
</style></head><body><div class="app"><aside class="side"><div class="brand"><div class="mark">EH</div><div><strong>ENGINEERING HUB</strong><small>Operations dashboard</small></div></div><div class="menutitle">WORKSPACE</div><nav id="mainNav" class="navblock"></nav><div class="sidebar-foot">PERSONAL / CHIEF ENGINEER<br>Private GitHub repository<br><a href="https://github.com/cestaahorro6/virage-engineering-hub" target="_blank" rel="noopener">Open repository ↗</a></div></aside><div class="main"><div class="top"><div class="crumb" id="breadcrumb">Dashboard</div><div class="top-right"><div class="sync"><strong id="syncName"><span class="dot"></span> Copia local</strong><span id="syncDate">16 NOV 2026</span></div><button class="btn" id="openConnect">↻ Sincronizar</button></div></div><main class="content" id="content"></main></div></div><div class="modalback" id="modalback"><div class="modal" id="modal"></div></div>
<script>
const START_DATA={generatedAt:null,source:'encrypted-cloud',issues:[]};
let issues=START_DATA.issues, connectedToken='',active='dashboard',search='',filterStatus='all',filterCar='all',viewMode='cards',savedPins=loadJSON('engineering-hub-pins',[]),drafts=loadJSON('engineering-hub-drafts',[]),lastSync=START_DATA.generatedAt;
const REPO='cestaahorro6/virage-engineering-hub', GH='https://github.com/'+REPO;
const VIEWS=[['dashboard','◫','Dashboard'],['board','▦','Mi tablero'],['CH017','01','CH017'],['CH023','02','CH023'],['CH024','03','CH024'],['work','⚙','Órdenes de trabajo'],['supplies','⬡','Pedidos y entregas'],['tests','◷','Tests y eventos'],['log','▤','Daily Log'],['all','≡','Todas las tareas']];
const $=s=>document.querySelector(s);function e(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))};function loadJSON(k,def){try{return JSON.parse(localStorage.getItem(k))??def}catch{return def}}function store(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}
const isDone=c=>c.status==='completed';const typeOf=c=>(c.labels||[]).find(x=>['workshop','supply','test','wiring','documentation','access','log'].includes(x))||'general';const niceDate=s=>s?new Date(s).toLocaleDateString('es-ES',{timeZone:'Europe/Madrid',day:'2-digit',month:'short'}):'Sin fecha';const isUrgent=c=>c.status==='urgent';const order=c=>({urgent:0,todo:1,'in-progress':2,waiting:3,tracking:4,completed:5}[c.status]??9);
function checkCounts(c){let n=0,d=0;for(const k of c.checklists||[])for(const x of k.items||[]){n++;if(x.done)d++}return [d,n]}
function section(c){let text=c.title.toLowerCase();if(text.includes('winter revision')||text.includes('rebuild')||text.includes('workshop'))return'work';if(/delivery|deliveries|order|purchase|receive|ship|air filter|3mo/.test(text)||c.labels.includes('supply')||c.labels.includes('wiring'))return'supplies';if(/barcelona|shakedown|hh|test/.test(text))return'tests';if(c.labels.includes('log')||text.includes('daily engineering log'))return'log';return'general'}
function relevant(c){if(['CH017','CH023','CH024'].includes(active))return c.car===active;if(active==='work')return section(c)==='work';if(active==='supplies')return section(c)==='supplies';if(active==='tests')return section(c)==='tests';if(active==='log')return section(c)==='log';return true}
function visible(){let q=search.trim().toLowerCase();return issues.filter(c=>relevant(c)&&(filterCar==='all'||c.car===filterCar)&&(filterStatus==='all'||c.status===filterStatus)&&(!q||[c.title,c.preview,c.body,...(c.checklists||[]).flatMap(k=>[k.name,...(k.items||[]).map(t=>t.text)])].join(' ').toLowerCase().includes(q))).sort((a,b)=>order(a)-order(b)||String(a.due||'9999').localeCompare(String(b.due||'9999')))}
function tag(st){return `<span class="tag ${e(st)}">${e(({urgent:'● URGENTE',todo:'PENDIENTE','in-progress':'EN CURSO',waiting:'EN ESPERA',completed:'COMPLETADA',tracking:'REGISTRO'})[st]||st)}</span>`}
function stat(label,value,note){return `<article class="metric"><div class="title">${e(label)}</div><div class="value">${value}</div><div class="minor">${e(note)}</div></article>`}
function taskCard(c,compact=false){let [d,n]=checkCounts(c);return `<article class="task"><div class="pillline">${tag(c.status)}<span class="tag">${e(c.car)}</span>${c.labels.includes('priority:high')?'<span class="tag urgent">ALTA</span>':''}</div><h3>${e(c.title)}</h3><p>${e(c.preview||c.body||'Sin notas')}</p>${n?`<div class="bar"><span style="width:${100*d/n}%"></span></div><div style="font-size:11px;color:#8793a1;margin-top:4px">${d}/${n} comprobaciones</div>`:''}<div class="taskfoot"><small>${e(niceDate(c.due))} · #${e(c.number)}</small><button type="button" data-detail="${e(c.id)}">Ver detalles ↗</button></div></article>`}
function titleArea(t,desc){return `<div class="hrow"><div><div class="eyebrow">CHIEF ENGINEER / OPERATIONS</div><h1>${e(t)}</h1><div class="muted">${e(desc)}</div></div><div class="actions"><button class="btn" id="newDraft">＋ Nueva nota</button><a class="btn dark" target="_blank" rel="noopener" href="${GH}/issues">GitHub Issues ↗</a></div></div>`}
function miniRow(c){return `<div class="minirow"><div class="miniicon">${isUrgent(c)?'!':c.car==='CH017'?'01':c.car==='CH023'?'23':c.car==='CH024'?'24':'✦'}</div><div class="body"><b>${e(c.title)}</b><small>${e(c.car)} · ${e(niceDate(c.due))}</small></div>${tag(c.status)}<button data-detail="${e(c.id)}">Ver</button></div>`}
function carTile(name,desc){let cs=issues.filter(c=>c.car===name);return `<div class="vehicle" data-view="${e(name)}"><div class="eyebrow">LIGIER JSP4 / CHASSIS</div><div class="code">${e(name)}</div><div class="help">${e(desc)}</div><div class="bottom"><span>${cs.length} tareas</span><span>Ver coche ↗</span></div></div>`}
function overview(){let pending=issues.filter(c=>!isDone(c)&&c.status!=='tracking'),urgent=issues.filter(isUrgent),waiting=issues.filter(c=>c.status==='waiting');let out=titleArea('Mission Control','Control de ingeniería, taller y operaciones en una sola pantalla.');out+=`<div class="metrics">${stat('Tareas abiertas',pending.length,'Sin contar Daily Log')}${stat('Urgencias',urgent.length,'Atención inmediata')}${stat('En taller',issues.filter(c=>c.status==='in-progress').length,'Rebuild / Winter Revision')}${stat('Esperando',waiting.length,'Entregas y confirmaciones')}</div>`;
const hot=urgent[0];if(hot)out+=`<div class="notice"><div class="icon">!</div><div><strong>Prioridad crítica: ${e(hot.title)}</strong><p>${e(hot.preview||'')}. <button style="border:0;color:#7a451e;background:none;font-weight:800;cursor:pointer" data-detail="${e(hot.id)}">Abrir orden ↗</button></p></div></div>`;
out+=`<div class="cars">${carTile('CH017','Barcelona main test · HH Management · Winter Revision')}${carTile('CH023','Winter rebuild · envío del cableado · GBX')}${carTile('CH024','Winter rebuild · motor · shakedown')}</div><div class="twocol"><section class="panel"><div class="panelhead"><h2>Prioridades del momento</h2><button class="btn" data-view="board">Abrir tablero</button></div>${issues.filter(c=>c.status==='urgent'||c.labels.includes('priority:high')||(c.status==='todo'&&c.due)).sort((a,b)=>order(a)-order(b)).slice(0,6).map(miniRow).join('')}</section><section class="panel"><div class="panelhead"><h2>Próximas fechas</h2></div>${issues.filter(c=>c.due&&!isDone(c)).sort((a,b)=>a.due.localeCompare(b.due)).slice(0,6).map(miniRow).join('')||'<div class="panelbody muted">Sin fechas registradas</div>'}</section></div>`;return out}
function controls(){return `<div class="filterbar"><input id="query" class="search" placeholder="Buscar por pieza, coche, referencia, pedido..." value="${e(search)}"><select id="fcar"><option value="all">Todos los coches</option>${['CH017','CH023','CH024','GENERAL'].map(x=>`<option ${filterCar===x?'selected':''}>${x}</option>`).join('')}</select><select id="fstatus"><option value="all">Todos los estados</option>${['urgent','todo','in-progress','waiting','tracking','completed'].map(x=>`<option value="${x}" ${filterStatus===x?'selected':''}>${({'urgent':'Urgente','todo':'Pendiente','in-progress':'En curso','waiting':'En espera','tracking':'Registro','completed':'Completadas'})[x]}</option>`).join('')}</select><button class="btn" id="clear">Limpiar</button></div>`}
function tasksPage(){let titles={CH017:'CH017',CH023:'CH023',CH024:'CH024',work:'Órdenes de trabajo',supplies:'Pedidos y entregas',tests:'Tests y eventos',log:'Daily Engineering Log',all:'Todas las tareas'};let desc={CH017:'Main test · Barcelona · Winter Revision',CH023:'Winter rebuild · Loom shipment · revisión',CH024:'Winter rebuild · Engine · Shakedown',work:'Revisiones generales y trabajos específicos por chasis',supplies:'Órdenes, material, proveedores y recepción de piezas',tests:'Circuit de Barcelona-Catalunya y preparación HH',log:'Registro cronológico de ingeniería',all:'Buscar en las órdenes del repositorio privado'};let arr=visible();return titleArea(titles[active]||'Tareas',desc[active]||'')+controls()+`<div class="cards">${arr.map(c=>taskCard(c)).join('')||'<div class="empty">No hay resultados para estos filtros.</div>'}</div>`}
function boardPage(){let c=visible();return titleArea('Mi tablero','Vista Kanban de lectura. Los cambios se registran en GitHub Issues.')+controls()+`<div class="kanban">${[['urgent','URGENTE'],['todo','PENDIENTE'],['in-progress','EN CURSO'],['waiting','ESPERANDO'],['completed','TERMINADO']].map(([st,name])=>`<section class="lane"><h3>${name}<span>${c.filter(x=>x.status===st).length}</span></h3>${c.filter(x=>x.status===st).map(x=>taskCard(x,true)).join('')||'<p class="helptext">Sin tareas</p>'}</section>`).join('')}</div>`}
function viewChange(v){active=v;search='';filterStatus='all';filterCar='all';render()}
function render(){let n=issues.filter(x=>x.status!=='tracking').length;$('#mainNav').innerHTML=VIEWS.map(([id,icon,name])=>`<button type="button" class="navitem ${active===id?'active':''}" data-view="${id}"><i>${icon}</i>${e(name)}${id==='all'?`<span class="n">${n}</span>`:''}</button>`).join('');$('#breadcrumb').textContent=VIEWS.find(v=>v[0]===active)?.[2]||active;$('#content').innerHTML=active==='dashboard'?overview():active==='board'?boardPage():tasksPage();document.querySelectorAll('[data-view]').forEach(x=>x.addEventListener('click',()=>viewChange(x.dataset.view)));document.querySelectorAll('[data-detail]').forEach(x=>x.addEventListener('click',()=>detail(x.dataset.detail)));let q=$('#query');if(q){q.addEventListener('input',ev=>{let pos=q.selectionStart;search=ev.target.value;render();let nq=$('#query');nq.focus();nq.setSelectionRange(pos,pos)});$('#fcar').onchange=ev=>{filterCar=ev.target.value;render()};$('#fstatus').onchange=ev=>{filterStatus=ev.target.value;render()};$('#clear').onclick=()=>{search='';filterCar='all';filterStatus='all';render()}}if($('#newDraft'))$('#newDraft').onclick=draftDialog;updateSyncIndicator()}
function overlay(html){$('#modal').innerHTML=html;$('#modalback').classList.add('visible');$('#modal').querySelectorAll('[data-close]').forEach(b=>b.onclick=close)}function close(){$('#modalback').classList.remove('visible')}$('#modalback').addEventListener('click',ev=>{if(ev.target===$('#modalback'))close()});document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});
function detail(id){let c=issues.find(x=>x.id===id);if(!c)return;let [d,n]=checkCounts(c);let content=`<div class="modalhead"><div><div class="eyebrow">GITHUB ISSUE #${e(c.number)} · ${e(c.car)}</div><h2>${e(c.title)}</h2></div><button class="close" type="button" data-close>×</button></div><div class="pillline">${tag(c.status)}${(c.labels||[]).map(l=>`<span class="tag">${e(l)}</span>`).join('')}</div><p class="helptext">Fecha objetivo: ${e(niceDate(c.due))} · ${n?`${d}/${n} checks realizados`:'Sin checklist'}</p><div class="description">${e(c.body||'Sin notas técnicas')}</div>`;
if(n)content+=`<section class="checks">${(c.checklists||[]).map(k=>`<h4>${e(k.name)} · ${(k.items||[]).filter(i=>i.done).length}/${(k.items||[]).length}</h4>${(k.items||[]).map(i=>`<div class="check"><span class="boxcheck ${i.done?'checked':''}">${i.done?'✓':''}</span><span>${e(i.text)}</span></div>`).join('')}`).join('')}</section>`;
content+=`<p class="warning">Solo consulta. Una casilla se considera terminada únicamente si ha sido marcada en GitHub tras confirmación del trabajo.</p><div class="actions"><a class="btn dark" href="${e(c.url)}" target="_blank" rel="noopener">Abrir tarea en GitHub ↗</a><button type="button" class="btn" id="copyTask">Copiar referencia</button></div>`;overlay(content);$('#copyTask').onclick=()=>copyText('#'+c.number+' '+c.title+'\n'+c.url)}
function draftDialog(){overlay(`<div class="modalhead"><div><div class="eyebrow">NOTA RÁPIDA</div><h2>Crear borrador</h2></div><button class="close" data-close>×</button></div><p class="helptext">Guarda la información en este dispositivo y copia el texto para enviármelo en ChatGPT. No se creará ninguna tarea hasta que yo la registre en GitHub.</p><form id="draftForm"><label class="field">Título<input id="dt" required placeholder="Ej.: Check engine loom connectors" maxlength="180"></label><label class="field">Coche<select id="dc"><option>GENERAL</option><option>CH017</option><option>CH023</option><option>CH024</option></select></label><label class="field">Detalles<textarea id="dd" placeholder="Qué hay que revisar, piezas y fecha..."></textarea></label><button class="btn dark" type="submit">Copiar nota para ChatGPT</button></form>`);$('#draftForm').onsubmit=ev=>{ev.preventDefault();let data={title:$('#dt').value.trim(),car:$('#dc').value,desc:$('#dd').value.trim(),at:new Date().toISOString()};if(!data.title)return;drafts.unshift(data);store('engineering-hub-drafts',drafts);let text='Registra en GitHub Engineering Hub una tarea pendiente para '+data.car+': '+data.title+'. Detalles: '+(data.desc||'Sin más detalles')+'. No marques nada como completado.';copyText(text);close()}}
function copyText(txt){if(navigator.clipboard?.writeText){navigator.clipboard.writeText(txt).then(()=>alert('Texto copiado. Pégalo en ChatGPT.')).catch(()=>copyFallback(txt))}else copyFallback(txt)}function copyFallback(txt){overlay(`<div class="modalhead"><h2>Copiar texto</h2><button class="close" data-close>×</button></div><textarea class="field" id="manualCopy" style="width:100%;height:130px">${e(txt)}</textarea><p class="helptext">Selecciona el texto y cópialo.</p>`);$('#manualCopy').select()}
function parseBody(body){let lines=String(body||'').split(/\r?\n/), groups=[],block=null,desc=[];for(const line of lines){const h=line.match(/^###\s+(.*)/);if(h){block={name:h[1],items:[]};groups.push(block);continue}const x=line.match(/^-\s+\[([xX ])\]\s+(.*)/);if(x){if(!block){block={name:'Checklist',items:[]};groups.push(block)}block.items.push({text:x[2],done:x[1].toLowerCase()==='x'});continue}if(!/^\*\*Stage imported from Trello|\*\*Legacy reference/.test(line)&&!line.startsWith('---'))desc.push(line)}return {groups,description:desc.join('\n').replace(/\n{3,}/g,'\n\n').trim()}}
function convertIssue(g){const names=(g.labels||[]).map(x=>typeof x==='string'?x:x.name);const title=g.title||'';const ch=title.match(/CH0(?:17|23|24)/i)?.[0]?.toUpperCase()||'GENERAL';const flags=['urgent','in-progress','waiting','tracking','todo'];let status=g.state==='closed'?'completed':flags.find(x=>names.includes(x))||'todo';const m=(g.body||'').match(/\*\*Due date \(if set\):\*\*\s*([^\n]+)/i);const due=m&&/^\d{4}-\d\d-\d\d/.test(m[1])?m[1].trim():null;const parsed=parseBody(g.body);let desc=parsed.description.split('## Technical notes').at(-1).trim();return {id:String(g.number),number:g.number,title,car:ch,due,body:desc,preview:desc.split('\n').filter(x=>x.trim()&&!x.startsWith('##')).slice(0,3).join(' ').slice(0,260),status,labels:names,url:g.html_url||GH+'/issues/'+g.number,checklists:parsed.groups,source:'github-live'}}
function updateSyncIndicator(){
  $('#syncName').innerHTML=connectedToken?'<span class="dot live"></span> GitHub cifrado':'<span class="dot"></span> Acceso protegido';
  $('#syncDate').textContent='Datos: '+(lastSync?new Date(lastSync).toLocaleString('es-ES',{timeZone:'Europe/Madrid',dateStyle:'short',timeStyle:'short'}):'pendientes de sincronización');
}
let unlockPassword='';
function fromBase64(value){return Uint8Array.from(atob(value),x=>x.charCodeAt(0))}
async function decryptSnapshot(payload,password){
  if(payload.version!==1||!payload.salt||!payload.iv||!payload.data||payload.iterations<200000)throw Error('Formato de datos cifrados no válido.');
  const raw=await crypto.subtle.importKey('raw',new TextEncoder().encode(password),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:fromBase64(payload.salt),iterations:payload.iterations,hash:'SHA-256'},raw,{name:'AES-GCM',length:256},false,['decrypt']);
  const plaintext=await crypto.subtle.decrypt({name:'AES-GCM',iv:fromBase64(payload.iv)},key,fromBase64(payload.data));
  return JSON.parse(new TextDecoder().decode(plaintext));
}
async function updateFromGithub(){
  if(!unlockPassword)throw Error('Introduce tu contraseña de acceso.');
  const response=await fetch('./snapshot.enc.json?ts='+Date.now(),{cache:'no-store'});
  if(!response.ok)throw Error('La primera publicación de datos todavía no se ha completado (HTTP '+response.status+').');
  let snapshot;
  try{snapshot=await decryptSnapshot(await response.json(),unlockPassword)}
  catch(ex){throw Error('No se puede abrir el panel. Comprueba la contraseña y los datos publicados.');}
  if(!Array.isArray(snapshot.issues))throw Error('El formato de las tareas no es correcto.');
  const latest=snapshot.issues.filter(g=>!g.pull_request).map(convertIssue);
  issues=latest;
  lastSync=snapshot.generatedAt||new Date().toISOString();
  connectedToken='encrypted';
  updateSyncIndicator();render();
  return issues.length;
}
function connectDialog(){
  overlay(`<div class="modalhead"><div><div class="eyebrow">ACCESO PRIVADO · DATOS CIFRADOS</div><h2>Engineering Hub</h2></div><button class="close" data-close>×</button></div><p class="helptext">Los trabajos de los coches se mantienen en un repositorio privado. Esta web solo descarga un archivo cifrado, protegido mediante tu contraseña personal.</p><p class="warning">La dirección de la web es pública, pero las tareas se publican <strong>cifradas</strong>. Usa una contraseña larga y exclusiva. No la compartas en el chat.</p><form id="connectForm"><label class="field">Contraseña del panel<input type="password" id="passphrase" autocomplete="off" required placeholder="Contraseña de acceso" /></label><div class="actions"><button type="submit" class="btn dark">Desbloquear y actualizar</button></div><p id="connectError" class="helptext"></p></form><p class="helptext">Una vez abierto, el panel revisa las actualizaciones cada cinco minutos. No guarda la contraseña en tu navegador.</p>`);
  $('#connectForm').onsubmit=async ev=>{
    ev.preventDefault();const candidate=$('#passphrase').value;
    unlockPassword=candidate;$('#connectError').textContent='Descifrando última actualización…';
    try{await updateFromGithub();close()}catch(ex){unlockPassword='';connectedToken='';$('#connectError').textContent=ex.message;updateSyncIndicator()}
  };
}
$('#openConnect').onclick=()=>unlockPassword?updateFromGithub().catch(err=>alert('No se pudo actualizar: '+err.message)):connectDialog();
setInterval(()=>{if(unlockPassword&&document.visibilityState==='visible')updateFromGithub().catch(console.warn)},5*60*1000);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&unlockPassword)updateFromGithub().catch(console.warn)});
render();connectDialog();
</script></body></html>
